name: R5 desktop quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-desktop-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  milestone:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run R5 milestone gate
        run: pnpm run test:r5:milestone -- --seed "${{ github.sha }}-milestone"

      - name: Upload sanitized gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r5-milestone-${{ github.sha }}
          path: test-results/r5-gates/*.json
          if-no-files-found: warn
          retention-days: 14
