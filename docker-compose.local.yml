name: hematuria-local-fullstack

services:
  redis:
    image: redis:7.4-alpine
    container_name: hematuria-local-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - hematuria-local-redis-data:/data

volumes:
  hematuria-local-redis-data:
